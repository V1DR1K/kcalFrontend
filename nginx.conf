server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets (Vite genera nombres con hash) - cache inmortal
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # OCR self-hosted (tesseract worker/core/traineddata) y fuentes - immutables
    location /tessdata/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El documento se sirve desde cache hasta 5 minutos y se revalida.
    location = /index.html {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
