server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets (Vite genera nombres con hash) - cache inmortal
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # OCR self-hosted (tesseract worker/core/traineddata) y fuentes - immutables
    location /tessdata/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El documento se sirve desde cache hasta 5 minutos y se revalida.
    location = /index.html {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # El manifest debe revalidarse para que el navegador detecte cambios de nombre,
    # icono o configuracion de la app instalada.
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # Si el icono cambia, publicar un nuevo nombre de archivo permite conservar
    # el cache inmortal de los iconos ya descargados.
    location /icons/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
