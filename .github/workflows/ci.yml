name: ScaleGrams CI
on:
  push:
    branches: [main, dev, "fix/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:frontend
      - run: npm run build
        env:
          GIT_HASH: ${{ github.sha }}
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e -- --project=chromium --project=webkit-iphone --workers=2
      - run: npm run test:e2e -- e2e/day-presets-responsive.spec.js e2e/safari-responsive.spec.js --project=webkit-iphone-short --project=webkit-ipad --project=webkit-iphone-landscape --workers=2
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: scalegrams-production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: ssh "$VPS_USER@$VPS_HOST" "cd /opt/projects/scalegrams/front/scalegrams-frontend && git fetch origin main && git diff --quiet && git diff --cached --quiet && git checkout main && git pull --ff-only origin main && test \"\$(git rev-parse HEAD)\" = '${{ github.sha }}' && bash scripts/release-web.sh ${{ github.sha }}"
      - name: Verify production host identity
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: ssh "$VPS_USER@$VPS_HOST" 'html="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 https://scalegrams.neticar.com.ar/)"; grep -q "<title>ScaleGrams" <<<"$html"'
      - name: Verify published web revision
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          revision="$(ssh "$VPS_USER@$VPS_HOST" 'curl --fail --silent --show-error --retry 6 --retry-delay 5 https://scalegrams.neticar.com.ar/version.json')"
          grep -Fq '${{ github.sha }}' <<<"$revision"
